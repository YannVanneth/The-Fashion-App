version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: fashion-app
    restart: unless-stopped
    environment:
      POSTGRES_USER: fashionapp
      POSTGRES_PASSWORD: fashionapp123
      POSTGRES_DB: fashion_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fashionapp -d fashion_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
