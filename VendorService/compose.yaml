services:
  VendorServiceDb:
    image: postgres:16
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: vendor_service_db
      POSTGRES_PASSWORD: vendor_service_db
      POSTGRES_DB: vendor_service_db
    ports:
      - "8006:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
   